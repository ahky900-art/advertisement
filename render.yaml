services:
  - type: web
    name: advertisement-naver-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NAVER_SA_API_KEY
        sync: false
      - key: NAVER_SA_SECRET_KEY
        sync: false
      - key: NAVER_SA_CUSTOMER_ID
        sync: false
